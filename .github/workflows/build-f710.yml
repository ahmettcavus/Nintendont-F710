name: Build Nintendont F710

on:
  workflow_dispatch:
    inputs:
      debug_hid:
        description: "Debug build (writes USB controller messages to ndebug.log)"
        type: boolean
        default: true
      phantom_fix:
        description: "Phantom stick fix (untick to build without it, for comparison)"
        type: boolean
        default: true
      hotplug_poll:
        description: "Experimental: find the F710 again after replugging the receiver"
        type: boolean
        default: true
      f710_slot:
        description: "Controller slot for the F710 (1 = original behaviour; Wii Remotes fill the other slots)"
        type: choice
        options: ["1", "2", "3", "4"]
        default: "2"

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITPPC: /opt/devkitpro/devkitPPC
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply F710 changes
        run: |
          set -eu
          f=kernel/HID.c
          # 1. Treat the Logitech F710 in X mode (046D:C21F) as the Xbox 360 controller
          sed -i 's/(DeviceVID == 0x045e \&\& DevicePID == 0x028e)/(DeviceVID == 0x046d \&\& DevicePID == 0xc21f)/' $f
          # 2. Skip every USB device except the F710 (keeps USB drives untouched, accepts OUT-first endpoint order)
          sed -i 's/if (isXBOX \&\& bEndpointAddress != 0x81)/if (!isXBOX)/' $f
          # 3. Full-power rumble on both motors
          sed -i 's/HIDXBOX360SetRumble( 0, 128, 0, 1 );/HIDXBOX360SetRumble( 0, 255, 0, 255 );/' $f
          # Fail the build if any change did not apply
          grep -q 'DevicePID == 0xc21f' $f
          grep -q 'if (!isXBOX)' $f
          grep -q 'HIDXBOX360SetRumble( 0, 255, 0, 255 );' $f
          echo "F710 changes applied"

      - name: Fix phantom stick input
        if: ${{ inputs.phantom_fix }}
        run: |
          set -eu
          f=kernel/HID.c
          # 4. Non-input packets (startup/status messages) no longer overwrite the pad state with zeros
          perl -0pi -e 's{\{\s*// ignore the 4 startup messages\s*u8 i;\s*for \(i = 0; i < wMaxPacketSize; i\+\+\)\s*Packet\[i\] = 0;\s*\}}{\{\r\n\t\t// not an input report (startup/status message): keep the last real input\r\n\t\tHIDInterruptBulkMessage(Packet, wMaxPacketSize, bEndpointAddressController, hidqueue, hidreadcontrollermsg);\r\n\t\treturn;\r\n\t\}}' $f
          # 5. Start Xbox-type pads with centered sticks instead of all zeros (0 = stick pushed to the edge)
          perl -0pi -e 's{(memset32\(HID_Packet, 0, MemPacketSize\);)}{$1\r\n\t\t\t\tif (isXBOX)\r\n\t\t\t\t\t{ u8 *p = (u8*)HID_Packet; p[6] = p[7] = p[8] = p[9] = 0x80; } // centered sticks}' $f
          grep -q 'keep the last real input' $f
          grep -q 'p\[9\] = 0x80' $f
          echo "Phantom stick fix applied"

      - name: Put the F710 in the chosen slot
        env:
          F710_SLOT: ${{ inputs.f710_slot }}
        run: |
          set -eu
          f=loader/source/ppc/PADReadGC/source/PADReadGC.c
          # 7. The USB pad takes the first free slot at or after F710_SLOT instead of the first free slot overall
          sed -i "1i #define F710_SLOT ${F710_SLOT}" $f
          perl -0pi -e 's{if\(HIDPad == HID_PAD_NOT_SET\)(\s*\{\s*\*HIDMotor = \(MotorCommand\[chan\]&0x3\);\s*HIDPad = chan;)}{if(HIDPad == HID_PAD_NOT_SET && chan >= (F710_SLOT - 1))$1}' $f
          grep -q 'chan >= (F710_SLOT - 1)' $f
          echo "F710 slot set to ${F710_SLOT}"

      - name: Skip rumble when no controller is connected
        run: |
          set -eu
          f=kernel/HID.c
          # 6. Don't send rumble/LED commands when no controller is connected (stops errors after unplugging)
          sed -i 's/if (bEndpointAddressOut == 0)/if (bEndpointAddressOut == 0 || ControllerID == 0)/' $f
          test "$(grep -c 'bEndpointAddressOut == 0 || ControllerID == 0' $f)" = "2"
          echo "Unplugged-rumble fix applied"

      - name: Experimental replug detection
        if: ${{ inputs.hotplug_poll }}
        run: |
          set -eu
          f=kernel/HID.c
          # 8. While no controller is connected, open a fresh USB connection every ~2 s,
          #    read the current device list (answered immediately on a new connection)
          #    and pick up the F710 once it has finished switching to X mode.
          cat > /tmp/f710_poll.c <<'EOF'
          #define F710_POLL_TICKS 1000
          static usb_device_entry F710PollDevices[32] ALIGNED(32);
          static u32 F710PollTimer = 0;
          static s32 F710PollLastCount = -1000;
          static void F710PollForController(u32 LoaderRequest)
          {
          	s32 h, n, r;
          	u32 i, found = 0;
          	h = IOS_Open("/dev/usb/ven", 0);
          	if (h < 0)
          	{
          		dbgprintf("HID:poll open failed:%d\r\n", h);
          		return;
          	}
          	memset32(F710PollDevices, 0, sizeof(usb_device_entry)*32);
          	n = IOS_Ioctl(h, GetDeviceChange, NULL, 0, F710PollDevices, 0x180);
          	r = IOS_Ioctl(h, AttachFinish, NULL, 0, NULL, 0);
          	IOS_Close(h);
          	for (i = 0; i < 32; ++i)
          	{
          		if (F710PollDevices[i].vid == 0x046d && F710PollDevices[i].pid == 0xc21f)
          			found = 1;
          	}
          	if (n != F710PollLastCount || found)
          	{
          		dbgprintf("HID:poll entries:%d attachfinish:%d f710:%u\r\n", n, r, found);
          		for (i = 0; i < 32; ++i)
          		{
          			if (F710PollDevices[i].vid != 0)
          				dbgprintf("HID:poll dev %04X:%04X id:%08X\r\n", F710PollDevices[i].vid, F710PollDevices[i].pid, F710PollDevices[i].device_id);
          		}
          		F710PollLastCount = n;
          	}
          	if (found)
          	{
          		memcpy(AttachedDevices, F710PollDevices, sizeof(usb_device_entry)*32);
          		HIDOpen(LoaderRequest);
          	}
          }

          EOF
          sed -i 's/^          //' /tmp/f710_poll.c
          perl -0pi -e 'BEGIN { local $/; open(my $fh, "<", "/tmp/f710_poll.c") or die; $poll = <$fh>; $poll =~ s/\r?\n/\r\n/g; } s/(void HIDUpdateRegisters\(u32 LoaderRequest\))/$poll$1/' $f
          perl -0pi -e 's/(\r\n)(\t\tif\(hidattached\)\r\n)/$1\t\tif(hidattached \&\& ControllerID == 0 \&\& hidchange == 0)\r\n\t\t{\r\n\t\t\tif(++F710PollTimer >= F710_POLL_TICKS)\r\n\t\t\t{\r\n\t\t\t\tF710PollTimer = 0;\r\n\t\t\t\tF710PollForController(LoaderRequest);\r\n\t\t\t}\r\n\t\t}\r\n\t\telse\r\n\t\t\tF710PollTimer = 0;\r\n$2/' $f
          test "$(grep -c 'F710PollForController(LoaderRequest);' $f)" = "1"
          grep -q 'static void F710PollForController' $f
          echo "Replug detection added"

      - name: Enable USB controller debug messages
        if: ${{ inputs.debug_hid }}
        run: |
          set -eu
          f=kernel/HID.c
          sed -i '1i #define DEBUG_HID' $f
          # Log every USB change event and whether the next change request was accepted
          perl -0pi -e 's{IOS_IoctlAsync\(HIDHandle, AttachFinish, NULL, 0, NULL, 0, hidqueue, hidattachmsg\);}{\{ s32 dbg_r = IOS_IoctlAsync(HIDHandle, AttachFinish, NULL, 0, NULL, 0, hidqueue, hidattachmsg); dbgprintf("HID:change event, AttachFinish queued:%d\\r\\n", dbg_r); \}}' $f
          perl -0pi -e 's#(HIDOpen\(LoaderRequest\);\s*memset32\(AttachedDevices, 0, sizeof\(usb_device_entry\)\*32\);\s*)IOS_IoctlAsync\(HIDHandle, GetDeviceChange, NULL, 0, AttachedDevices, 0x180, hidqueue, hidchangemsg\);#${1}{ s32 dbg_r = IOS_IoctlAsync(HIDHandle, GetDeviceChange, NULL, 0, AttachedDevices, 0x180, hidqueue, hidchangemsg); dbgprintf("HID:GetDeviceChange re-armed:%d\\r\\n", dbg_r); }#' $f
          # Log the first 30 non-button packets the receiver sends
          perl -0pi -e 's#(// not an input report \(startup/status message\): keep the last real input|// ignore the 4 startup messages)#${1}\r\n\t\t{ static u32 dbg_n = 0; if (dbg_n < 30) { dbg_n++; dbgprintf("HID:non-input packet %02X %02X %02X %02X\\r\\n", Packet[0], Packet[1], Packet[2], Packet[3]); } }#' $f
          grep -q 'AttachFinish queued' $f
          grep -q 'GetDeviceChange re-armed' $f
          grep -q 'non-input packet' $f
          echo "Debug logging added"

      - name: Preserve devkitPPC rule files
        run: |
          set -eu
          mkdir -p /tmp/nintendont-rules
          find "$DEVKITPPC" -maxdepth 1 -type f -exec cp -v {} /tmp/nintendont-rules/ \;

      - name: Download historical toolchains
        run: |
          set -eu
          mkdir -p /tmp/nintendont-tools
          cd /tmp/nintendont-tools
          curl -fL --retry 3 -o arm.pkg.tar.xz \
            'https://wii.leseratte10.de/devkitPro/devkitARM/r53%20%282019-06%29/devkitARM-r53-1-linux.pkg.tar.xz'
          curl -fL --retry 3 -o ppc.pkg.tar.xz \
            'https://wii.leseratte10.de/devkitPro/devkitPPC/r35/devkitPPC-r35-1-linux.pkg.tar.xz'
          curl -fL --retry 3 -o libogc.pkg.tar.xz \
            'https://wii.leseratte10.de/devkitPro/libogc/libogc_1.8.23%20%282019-10-02%29/libogc-1.8.23-1-any.pkg.tar.xz'
          ls -lh *.pkg.tar.xz

      - name: Install historical toolchains
        run: |
          set -eu
          cd /tmp/nintendont-tools
          rm -rf "$DEVKITARM" "$DEVKITPPC" "$DEVKITPRO/libogc"
          tar -xJf arm.pkg.tar.xz -C /
          tar -xJf ppc.pkg.tar.xz -C /
          tar -xJf libogc.pkg.tar.xz -C /
          cp -v /tmp/nintendont-rules/* "$DEVKITPPC/"
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version
          "$DEVKITPPC/bin/powerpc-eabi-gcc" --version

      - name: Compile Nintendont
        run: |
          set -eu
          export PATH="$DEVKITPPC/bin:$DEVKITARM/bin:$PATH"
          make -j1
          cp loader/loader.dol loader/boot.dol

      - name: Upload boot.dol
        uses: actions/upload-artifact@v4
        with:
          name: Nintendont-F710-boot-dol
          path: loader/boot.dol
          if-no-files-found: error
